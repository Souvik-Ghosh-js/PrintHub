{% extends "base.html" %}
{% block title %}Administrator — PrintHub{% endblock %}
{% block wrapclass %}wrap-tight{% endblock %}
{% block brandsub %}Admin{% endblock %}
{% block nav %}<a href="/">Home</a>{% endblock %}

{% block content %}
<div class="card" style="margin-top:2rem;">
  <h1 style="margin-bottom:.25rem;">Administrator</h1>
  <p class="muted" style="margin-bottom:1.25rem;">Platform control panel.</p>
  <form method="post" action="{{ url_for('admin_login') }}">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:1.1rem;">Sign in</button>
  </form>
</div>
{% endblock %}
