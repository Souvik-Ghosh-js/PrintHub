<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintHub — scan &amp; print at a shop near you</title>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0;
           background: #f2f4f8; color: #1c2333; }
    header { background: #1c2a6e; color: #fff; padding: 16px 20px; }
    header h1 { margin: 0; font-size: 1.3rem; }
    main { max-width: 640px; margin: 24px auto; padding: 0 12px; }
    .card { background: #fff; border-radius: 10px; padding: 18px;
            margin-bottom: 12px; box-shadow: 0 1px 4px rgba(20,30,80,.08); }
    a.shop { display: block; text-decoration: none; color: inherit; }
    a.shop:hover { outline: 2px solid #1c2a6e33; }
    .muted { color: #6a76a8; font-size: .88rem; }
    .err { color: #b32020; }
    footer { text-align: center; padding: 24px; }
    footer a { color: #6a76a8; font-size: .85rem; margin: 0 8px; }
  </style>
</head>
<body>
<header><h1>PrintHub</h1></header>
<main>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <h2 style="font-size:1.05rem;">Choose a print shop</h2>
  {% for v in shops %}
  <a class="shop card" href="{{ url_for('shop', code=v.shop_code) }}">
    <strong>{{ v.shop_name }}</strong>
    <div class="muted">B/W ₹{{ '%.2f' % v.price_bw }}/page ·
      Colour ₹{{ '%.2f' % v.price_colour }}/page</div>
  </a>
  {% else %}
  <p class="muted">No shops are online right now.</p>
  {% endfor %}
</main>
<footer>
  <a href="{{ url_for('vendor_login') }}">Vendor login</a> ·
  <a href="{{ url_for('admin_login') }}">Admin</a>
</footer>
</body>
</html>
